<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAQs — Sabi</title>
<meta name="description" content="Sabi — Every Scent. Your Signature. Designer, niche and signature perfumes, delivered gift-ready.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Jost:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF5F2}
*{box-sizing:border-box}
a{color:#2B1D21;text-decoration:none}a:hover{color:#9A5845}
button{font-family:inherit;cursor:pointer}
@keyframes sabiFadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes sabiFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes sabiPulse{0%{box-shadow:0 0 0 0 rgba(37,211,102,.55)}100%{box-shadow:0 0 0 20px rgba(37,211,102,0)}}
@keyframes sabiPop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes sabiDot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.s-fade{animation:sabiFadeUp 1s cubic-bezier(.2,.7,.2,1) both}.s-d1{animation-delay:.14s}.s-d2{animation-delay:.28s}
.s-float{animation:sabiFloat 6s ease-in-out infinite}.s-float-2{animation:sabiFloat 7.5s ease-in-out -2s infinite}.s-float-3{animation:sabiFloat 8.5s ease-in-out -4s infinite}
.s-pulse{animation:sabiPulse 2s ease-out infinite}
.s-pop{animation:sabiPop .5s cubic-bezier(.2,.7,.2,1) both}
.s-dot{animation:sabiDot 1.2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>
<script src="assets/js/sabi-runtime.js"></script>
<script src="assets/js/components.js"></script>
</head>
<body>
<div id="app"></div>

<!-- Page template (rendered by assets/js/sabi-runtime.js) -->
<template id="sabi-page">
<div style="width: 100%; min-height: 100vh; background: #FBF5F2; color: #2B1D21; font-family: Jost, system-ui, sans-serif">

<div style="background: #2B1D21; color: #F7EDE8; text-align: center; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; padding: 11px 16px">Complimentary discovery vial with every order</div>
<header style="border-bottom: 1px solid #EADDD7">
<div style="max-width: 1320px; margin: 0 auto; padding: 18px 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<nav aria-label="Primary" style="display: flex; flex-wrap: wrap; gap: 26px; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; flex: 1 1 360px">
<a href="index.html">Home</a>
<a href="product.html">Shop</a>
<a href="about.html">About Us</a>
<a href="history.html">Our History</a>
<a href="faq.html" style="border-bottom: 1px solid #2B1D21">FAQs</a>
</nav>
<a href="index.html" style="font-family: 'Cormorant Garamond', serif; font-size: 44px; font-weight: 500; letter-spacing: 0.32em; line-height: 1; padding-left: 0.32em">SABI</a>
<div style="display: flex; justify-content: flex-end; flex: 1 1 360px">
<a href="cart.html" style="min-height: 44px; display: flex; align-items: center; gap: 8px; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 8h14l-1 13H6L5 8z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>Bag</a>
</div>
</div>
</header>

<!-- Hero -->
<section style="max-width: 900px; margin: 0 auto; padding: 104px 32px 56px; display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center">
<p style="margin: 0; font-size: 13px; letter-spacing: 0.24em; text-transform: uppercase; color: {{accent}}; font-weight: 500">Help centre</p>
<h1 class="s-fade s-d1" style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: clamp(52px, 6vw, 88px); line-height: 1">Frequently asked <em>questions</em></h1>
<p style="margin: 0; font-size: 18px; line-height: 1.7; color: #5E4A4F; font-weight: 300">Everything you need to know about ordering, choosing and loving your Sabi fragrance.</p>
</section>

<!-- Categories -->
<div role="tablist" aria-label="FAQ topics" style="max-width: 1000px; margin: 0 auto; padding: 0 32px 48px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
<sc-if value="{{c.active}}" hint-placeholder-val="{{false}}">
<button role="tab" aria-selected="true" onClick="{{c.pick}}" style="min-height: 44px; padding: 0 24px; border-radius: 999px; border: 1px solid #2B1D21; background: #2B1D21; color: #FBF5F2; font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase">{{c.label}}</button>
</sc-if>
<sc-if value="{{c.inactive}}" hint-placeholder-val="{{true}}">
<button role="tab" aria-selected="false" onClick="{{c.pick}}" style="min-height: 44px; padding: 0 24px; border-radius: 999px; border: 1px solid #C9B2AA; background: transparent; color: #2B1D21; font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase">{{c.label}}</button>
</sc-if>
</sc-for>
</div>

<!-- Accordion -->
<section style="max-width: 920px; margin: 0 auto; padding: 0 32px 104px">
<div style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{faqs}}" as="f" hint-placeholder-count="8">
<div style="background: #FFFFFF; border: 1px solid #EADDD7; border-radius: 20px; padding: 0 28px">
<button onClick="{{f.toggle}}" aria-expanded="{{f.expanded}}" style="width: 100%; min-height: 76px; display: flex; justify-content: space-between; align-items: center; gap: 20px; border: 0; background: transparent; padding: 18px 0; text-align: left; color: #2B1D21">
<span style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: {{accent}}; font-weight: 500">{{f.cat}}</span>
<span style="font-family: 'Cormorant Garamond', serif; font-size: 26px; line-height: 1.2">{{f.q}}</span>
</span>
<span aria-hidden="true" style="flex: 0 0 40px; height: 40px; border-radius: 50%; border: 1px solid #D9C4BC; display: flex; align-items: center; justify-content: center; font-size: 20px">{{f.sign}}</span>
</button>
<sc-if value="{{f.open}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; padding: 0 56px 26px 0; font-size: 16px; line-height: 1.8; color: #5E4A4F">{{f.a}}</p>
</sc-if>
</div>
</sc-for>
</div>
</section>

<!-- Contact -->
<section style="padding: 0 32px 104px">
<div style="max-width: 1100px; margin: 0 auto; background: #F2DCD6; border-radius: 32px; padding: 64px 48px; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 32px; align-items: center">
<div style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: clamp(36px, 3.8vw, 52px); line-height: 1.05">Still have a <em>question?</em></h2>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #4E3B40">Our fragrance team is happy to help you choose, track an order or find the perfect gift.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<a href="#top" style="display: flex; align-items: center; gap: 14px; background: #FBF5F2; border-radius: 16px; padding: 18px 22px; font-size: 15px">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B1D21" stroke-width="1.5"><path d="M4 20l1.5-4A8 8 0 1 1 8 18.5L4 20z"></path></svg>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 500">WhatsApp us</span><span style="color: #5E4A4F">[YOUR WHATSAPP NUMBER]</span></span>
</a>
<a href="#top" style="display: flex; align-items: center; gap: 14px; background: #FBF5F2; border-radius: 16px; padding: 18px 22px; font-size: 15px">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B1D21" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 500">Email us</span><span style="color: #5E4A4F">[YOUR EMAIL]</span></span>
</a>
</div>
</div>
</section>

<footer style="background: #2B1D21; color: #E5D6D1; padding: 56px 32px 36px">
<div style="max-width: 1320px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'Cormorant Garamond', serif; font-size: 34px; letter-spacing: 0.3em; color: #F7EDE8; line-height: 1">SABI</span>
<span style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 19px; color: #E7BFB3">Every Scent. Your Signature.</span>
</div>
<nav aria-label="Footer" style="display: flex; flex-wrap: wrap; gap: 24px; font-size: 14px">
<a href="index.html" style="color: #E5D6D1">Home</a>
<a href="product.html" style="color: #E5D6D1">Shop</a>
<a href="about.html" style="color: #E5D6D1">About Us</a>
<a href="history.html" style="color: #E5D6D1">Our History</a>
<a href="faq.html" style="color: #E5D6D1">FAQs</a>
<a href="cart.html" style="color: #E5D6D1">Bag</a>
</nav>
<span style="font-size: 13px; color: #BFA9A3">© Sabi Fragrances. All rights reserved.</span>
</div>
</footer>

<dc-import name="Chat" hint-size="1px,1px"></dc-import>
</div>
</template>

<script src="assets/js/faq.js"></script>
</body>
</html>
