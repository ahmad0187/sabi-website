<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baccarat Rouge 540 — Sabi</title>
<meta name="description" content="Sabi — Every Scent. Your Signature. Designer, niche and signature perfumes, delivered gift-ready.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Jost:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF5F2}
*{box-sizing:border-box}
a{color:#2B1D21;text-decoration:none;transition:color .3s}a:hover{color:#9A5845}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
@keyframes sabiFadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes sabiFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes sabiSpin{to{transform:rotate(360deg)}}
@keyframes sabiPulse{0%{box-shadow:0 0 0 0 rgba(37,211,102,.55)}100%{box-shadow:0 0 0 20px rgba(37,211,102,0)}}
@keyframes sabiTwinkle{0%,100%{opacity:.15;transform:scale(.5)}50%{opacity:1;transform:scale(1)}}
@keyframes sabiPop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes sabiDot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.s-fade{animation:sabiFadeUp 1s cubic-bezier(.2,.7,.2,1) both}
.s-d1{animation-delay:.12s}.s-d2{animation-delay:.26s}.s-d3{animation-delay:.4s}.s-d4{animation-delay:.54s}
.s-float{animation:sabiFloat 6s ease-in-out infinite}
.s-float-2{animation:sabiFloat 7.5s ease-in-out -2s infinite}
.s-float-3{animation:sabiFloat 8.5s ease-in-out -4s infinite}
.s-spin{animation:sabiSpin 40s linear infinite}
.s-twinkle{animation:sabiTwinkle 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.s-pulse{animation:sabiPulse 2s ease-out infinite}
.s-pop{animation:sabiPop .4s cubic-bezier(.2,.7,.2,1) both}
.s-dot{animation:sabiDot 1.2s ease-in-out infinite}
.s-lift{transition:transform .5s cubic-bezier(.2,.7,.2,1),box-shadow .5s}
.s-lift:hover{transform:translateY(-8px);box-shadow:0 30px 60px -28px rgba(43,29,33,.45)}
.s-zoom{transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.s-lift:hover .s-zoom{transform:scale(1.07) rotate(-2deg)}
.s-btn{transition:transform .3s,background-color .3s,color .3s,box-shadow .3s}
.s-btn:hover{transform:translateY(-2px);box-shadow:0 14px 28px -14px rgba(43,29,33,.6)}
.s-btn-dark:hover{background-color:#5A3A44 !important;color:#FBF5F2 !important}
.s-btn-line:hover{background-color:#2B1D21 !important;color:#FBF5F2 !important}
.s-reveal-on [data-reveal]{opacity:0;transform:translateY(40px);transition:opacity 1s cubic-bezier(.2,.7,.2,1),transform 1s cubic-bezier(.2,.7,.2,1)}
.s-reveal-on [data-reveal].s-in{opacity:1;transform:none}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}.s-reveal-on [data-reveal]{opacity:1;transform:none}}
</style>
<script src="assets/js/sabi-runtime.js"></script>
<script src="assets/js/components.js"></script>
</head>
<body>
<div id="app"></div>

<!-- Page template (rendered by assets/js/sabi-runtime.js) -->
<template id="sabi-page">
<div style="width: 100%; min-height: 100vh; background: #FBF5F2; color: #2B1D21; font-family: Jost, system-ui, sans-serif; overflow-x: hidden">

<div style="background: #2B1D21; color: #F7EDE8; text-align: center; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; padding: 11px 16px">Complimentary discovery vial with every order</div>
<header style="position: sticky; top: 0; z-index: 40; background: rgba(251,245,242,0.86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid #EADDD7">
<div style="max-width: 1360px; margin: 0 auto; padding: 16px 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<nav aria-label="Primary" style="display: flex; flex-wrap: wrap; gap: 28px; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; flex: 1 1 360px">
<a href="index.html">Home</a>
<a href="product.html" style="border-bottom: 1px solid #2B1D21; padding-bottom: 2px">Shop</a>
<a href="about.html">About Us</a>
<a href="history.html">Our History</a>
<a href="faq.html">FAQs</a>
</nav>
<a href="index.html" style="font-family: 'Cormorant Garamond', serif; font-size: 46px; font-weight: 500; letter-spacing: 0.34em; line-height: 1; padding-left: 0.34em">SABI</a>
<div style="display: flex; justify-content: flex-end; flex: 1 1 360px">
<a href="cart.html" aria-label="Shopping bag" style="height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 8px">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 8h14l-1 13H6L5 8z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>
<span style="min-width: 22px; height: 22px; border-radius: 11px; background: #2B1D21; color: #FBF5F2; font-size: 12px; display: flex; align-items: center; justify-content: center; padding: 0 6px">{{bagCount}}</span>
</a>
</div>
</div>
</header>

<nav aria-label="Breadcrumb" style="max-width: 1360px; margin: 0 auto; padding: 24px 32px 0; font-size: 13px; letter-spacing: 0.08em; color: #5E4A4F; display: flex; flex-wrap: wrap; gap: 10px">
<a href="index.html" style="color: #5E4A4F">Home</a><span aria-hidden="true">/</span>
<a href="index.html" style="color: #5E4A4F">Unisex</a><span aria-hidden="true">/</span>
<span style="color: #2B1D21">Baccarat Rouge 540</span>
</nav>

<section style="max-width: 1360px; margin: 0 auto; padding: 28px 32px 104px; display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 64px; align-items: start">
<!-- Gallery -->
<div class="s-fade" style="display: flex; flex-direction: column; gap: 16px">
<div style="position: relative; height: 660px; border-radius: 32px; background: {{viewBg}}; display: flex; align-items: center; justify-content: center; overflow: hidden; transition: background-color .6s">
<div aria-hidden="true" class="s-spin" style="position: absolute; width: 500px; height: 500px; border-radius: 50%; border: 1px dashed #D9B8AE"></div>
<div aria-hidden="true" style="position: absolute; width: 380px; height: 380px; border-radius: 50%; background: rgba(255,255,255,0.5)"></div>
<span style="position: absolute; top: 22px; left: 22px; background: #2B1D21; color: #FBF5F2; border-radius: 999px; padding: 8px 16px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase">Bestseller</span>
<svg aria-hidden="true" width="100%" height="100%" viewBox="0 0 600 660" style="position: absolute; inset: 0; pointer-events: none">
<path class="s-twinkle" d="M110 150 l4 14 14 4 -14 4 -4 14 -4 -14 -14 -4 14 -4z" fill="#C9A27A"></path>
<path class="s-twinkle" style="animation-delay: 1.2s" d="M480 210 l3 10 10 3 -10 3 -3 10 -3 -10 -10 -3 10 -3z" fill="#C9A27A"></path>
<path class="s-twinkle" style="animation-delay: 2s" d="M460 500 l4 14 14 4 -14 4 -4 14 -4 -14 -14 -4 14 -4z" fill="#B97F6A"></path>
</svg>
<div class="s-float" style="position: relative; width: {{viewW}}; height: {{viewH}}; transition: width .6s, height .6s"><dc-import name="Bottle" shape="round" liquid="#C8423A" cap="#C9A27A" label="" hint-size="100%,100%"></dc-import></div>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{views}}" as="v" hint-placeholder-count="4">
<button class="s-btn" onClick="{{v.pick}}" aria-label="Show {{v.label}}" aria-pressed="{{v.pressed}}" style="height: 116px; border-radius: 18px; border: {{v.border}}; background: {{v.bg}}; display: flex; align-items: center; justify-content: center; padding: 10px">
<span style="width: 54px; height: 86px; display: block"><dc-import name="Bottle" shape="round" liquid="#C8423A" cap="#C9A27A" label="" hint-size="100%,100%"></dc-import></span>
</button>
</sc-for>
</div>
</div>

<!-- Info -->
<div style="display: flex; flex-direction: column; gap: 24px; padding-top: 8px">
<div class="s-fade s-d1" style="display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 13px; letter-spacing: 0.24em; text-transform: uppercase; color: {{accent}}; font-weight: 500">Maison Francis Kurkdjian</span>
<h1 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: clamp(52px, 5vw, 80px); line-height: 0.98">Baccarat Rouge 540</h1>
<p style="margin: 0; font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: #5E4A4F">Eau de Parfum · Unisex · Amber floral</p>
</div>
<span class="s-fade s-d2" style="font-size: 26px; font-weight: 500">Rs. [{{sizeLabel}} PRICE]</span>
<p class="s-fade s-d2" style="margin: 0; font-size: 17px; line-height: 1.8; color: #5E4A4F; font-weight: 300">A luminous, airy amber. Glowing saffron and jasmine meet mineral amberwood and ambergris, finishing on a warm trail of fir resin and cedar — the scent people stop you to ask about.</p>

<fieldset class="s-fade s-d3" style="border: 0; margin: 0; padding: 0">
<legend style="font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 500; padding: 0 0 12px">Size</legend>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{sizes}}" as="s" hint-placeholder-count="3">
<sc-if value="{{s.active}}" hint-placeholder-val="{{false}}">
<button class="s-btn" onClick="{{s.pick}}" aria-pressed="true" style="min-height: 54px; min-width: 112px; padding: 0 22px; border-radius: 16px; border: 1.5px solid #2B1D21; background: #2B1D21; color: #FBF5F2; font-size: 15px">{{s.label}}</button>
</sc-if>
<sc-if value="{{s.inactive}}" hint-placeholder-val="{{true}}">
<button class="s-btn s-btn-line" onClick="{{s.pick}}" aria-pressed="false" style="min-height: 54px; min-width: 112px; padding: 0 22px; border-radius: 16px; border: 1.5px solid #C9B2AA; background: #FFFFFF; color: #2B1D21; font-size: 15px">{{s.label}}</button>
</sc-if>
</sc-for>
</div>
</fieldset>

<div class="s-fade s-d3" style="display: flex; flex-wrap: wrap; gap: 12px; align-items: stretch">
<div style="display: flex; align-items: center; border: 1px solid #C9B2AA; border-radius: 999px; background: #FFFFFF">
<button onClick="{{dec}}" aria-label="Decrease quantity" style="width: 52px; height: 58px; border: 0; background: transparent; font-size: 22px; color: #2B1D21">−</button>
<span aria-live="polite" style="min-width: 32px; text-align: center; font-size: 17px">{{qty}}</span>
<button onClick="{{inc}}" aria-label="Increase quantity" style="width: 52px; height: 58px; border: 0; background: transparent; font-size: 22px; color: #2B1D21">+</button>
</div>
<button class="s-btn s-btn-dark" onClick="{{add}}" style="flex: 1 1 220px; min-height: 58px; border: 0; border-radius: 999px; background: #2B1D21; color: #FBF5F2; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase">Add to bag</button>
<button class="s-btn" onClick="{{wish}}" aria-pressed="{{wishPressed}}" aria-label="Add to wishlist" style="width: 58px; height: 58px; border-radius: 50%; border: 1px solid #C9B2AA; background: #FFFFFF; color: {{wishColor}}; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="{{wishFill}}" stroke="currentColor" stroke-width="1.5"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>
</button>
</div>
<sc-if value="{{added}}" hint-placeholder-val="{{false}}">
<div class="s-pop" role="status" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; background: #F2DCD6; border-radius: 18px; padding: 16px 20px; font-size: 15px">
<span style="display: flex; align-items: center; gap: 10px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2B1D21" stroke-width="2"><path d="M5 12l5 5 9-10"></path></svg>Added to your bag — beautiful choice.</span>
<a href="cart.html" style="font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; border-bottom: 1px solid #2B1D21">View bag</a>
</div>
</sc-if>

<div class="s-fade s-d4" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<div style="background: #FFFFFF; border: 1px solid #EADDD7; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center; font-size: 13px; color: #4E3B40">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B1D21" stroke-width="1.5"><rect x="9" y="2" width="6" height="5" rx="1"></rect><rect x="7" y="7" width="10" height="15" rx="3"></rect></svg>Free discovery vial</div>
<div style="background: #FFFFFF; border: 1px solid #EADDD7; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center; font-size: 13px; color: #4E3B40">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B1D21" stroke-width="1.5"><path d="M3 7h11v10H3zM14 10h4l3 3v4h-7z"></path><circle cx="7" cy="18" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg>Cash on delivery</div>
<div style="background: #FFFFFF; border: 1px solid #EADDD7; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center; font-size: 13px; color: #4E3B40">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B1D21" stroke-width="1.5"><rect x="3" y="9" width="18" height="12" rx="1"></rect><path d="M3 9h18M12 9v12"></path></svg>Gift-ready box</div>
</div>

<div style="border-top: 1px solid #D9C4BC">
<sc-for list="{{details}}" as="d" hint-placeholder-count="4">
<div style="border-bottom: 1px solid #D9C4BC">
<button onClick="{{d.toggle}}" aria-expanded="{{d.expanded}}" style="width: 100%; min-height: 64px; display: flex; justify-content: space-between; align-items: center; border: 0; background: transparent; padding: 0; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: #2B1D21; text-align: left">
<span>{{d.title}}</span><span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 50%; border: 1px solid #D9C4BC; display: flex; align-items: center; justify-content: center; font-size: 18px">{{d.sign}}</span>
</button>
<sc-if value="{{d.open}}" hint-placeholder-val="{{false}}">
<p class="s-pop" style="margin: 0; padding: 0 0 24px; font-size: 15px; line-height: 1.75; color: #5E4A4F">{{d.text}}</p>
</sc-if>
</div>
</sc-for>
</div>
</div>
</section>

<!-- Notes -->
<section style="background: #2B1D21; color: #F7EDE8; padding: 112px 32px">
<div style="max-width: 1360px; margin: 0 auto; display: flex; flex-direction: column; gap: 56px">
<div data-reveal style="display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
<p style="margin: 0; font-size: 13px; letter-spacing: 0.26em; text-transform: uppercase; color: #E7BFB3; font-weight: 500">The fragrance notes</p>
<h2 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: clamp(42px, 4.6vw, 64px); line-height: 1.02">How it <em>unfolds</em> on skin</h2>
</div>
<div data-reveal style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px">

<span style="font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: #E7BFB3; font-weight: 500">Top · first 15 minutes</span>
<span style="font-family: 'Cormorant Garamond', serif; font-size: 30px">Saffron, jasmine</span>
</div>
<div class="s-lift" style="background: #3A282E; border-radius: 26px; padding: 40px 30px; display: flex; flex-direction: column; gap: 14px; text-align: center; align-items: center">
<div class="s-float-2" aria-hidden="true" style="width: 84px; height: 84px; border-radius: 50%; background: #C8423A; box-shadow: 0 0 0 10px rgba(200,66,58,0.18)"></div>
<span style="font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: #E7BFB3; font-weight: 500">Heart · first hours</span>
<span style="font-family: 'Cormorant Garamond', serif; font-size: 30px">Amberwood, ambergris</span>
</div>
<div class="s-lift" style="background: #3A282E; border-radius: 26px; padding: 40px 30px; display: flex; flex-direction: column; gap: 14px; text-align: center; align-items: center">
<div class="s-float-3" aria-hidden="true" style="width: 84px; height: 84px; border-radius: 50%; background: #7A604C; box-shadow: 0 0 0 10px rgba(122,96,76,0.22)"></div>
<span style="font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: #E7BFB3; font-weight: 500">Base · the lasting trail</span>
<span style="font-family: 'Cormorant Garamond', serif; font-size: 30px">Fir resin, cedar</span>
</div>
</div>
</div>
</section>

<!-- Related -->
<section style="max-width: 1360px; margin: 0 auto; padding: 112px 32px">
<h2 data-reveal style="margin: 0 0 40px; font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: clamp(38px, 4.2vw, 56px); line-height: 1.05">You may also <em>love</em></h2>
<div data-reveal style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 22px">
<sc-for list="{{related}}" as="r" hint-placeholder-count="4">
<a class="s-lift" href="product.html" style="display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #EADDD7; border-radius: 26px; overflow: hidden">

<div class="s-zoom" style="width: 140px; height: 224px"><dc-import name="Bottle" shape="{{r.shape}}" liquid="{{r.liquid}}" cap="{{r.cap}}" label="" hint-size="100%,100%"></dc-import></div>
</div>
<div style="padding: 20px 22px 24px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: {{accent}}; font-weight: 500">{{r.brand}}</span>
<span style="font-family: 'Cormorant Garamond', serif; font-size: 26px">{{r.title}}</span>
<span style="font-size: 15px; font-weight: 500">Rs. [PRICE]</span>
</div>
</a>
</sc-for>
</div>
</section>

<footer style="background: #2B1D21; color: #E5D6D1; padding: 56px 32px 36px">
<div style="max-width: 1360px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'Cormorant Garamond', serif; font-size: 34px; letter-spacing: 0.3em; color: #F7EDE8; line-height: 1">SABI</span>
<span style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 19px; color: #E7BFB3">Every Scent. Your Signature.</span>
</div>
<nav aria-label="Footer" style="display: flex; flex-wrap: wrap; gap: 24px; font-size: 14px">

<a href="product.html" style="color: #E5D6D1">Shop</a>

<a href="history.html" style="color: #E5D6D1">Our History</a>

</nav>

</div>

</div>

</body>
