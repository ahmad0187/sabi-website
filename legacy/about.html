<style>
body{margin:0;background:#FBF5F2}
*{box-sizing:border-box}
a{color:#2B1D21;text-decoration:none}a:hover{color:#9A5845}
button{font-family:inherit;cursor:pointer}
@keyframes sabiFadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes sabiFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes sabiPulse{0%{box-shadow:0 0 0 0 rgba(37,211,102,.55)}100%{box-shadow:0 0 0 20px rgba(37,211,102,0)}}
@keyframes sabiPop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes sabiDot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.s-fade{animation:sabiFadeUp 1s cubic-bezier(.2,.7,.2,1) both}.s-d1{animation-delay:.14s}.s-d2{animation-delay:.28s}
.s-float{animation:sabiFloat 6s ease-in-out infinite}.s-float-2{animation:sabiFloat 7.5s ease-in-out -2s infinite}.s-float-3{animation:sabiFloat 8.5s ease-in-out -4s infinite}
.s-pulse{animation:sabiPulse 2s ease-out infinite}
.s-pop{animation:sabiPop .5s cubic-bezier(.2,.7,.2,1) both}
.s-dot{animation:sabiDot 1.2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
