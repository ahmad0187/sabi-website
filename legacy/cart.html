<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Bag — Sabi</title>
<meta name="description" content="Sabi — Every Scent. Your Signature. Designer, niche and signature perfumes, delivered gift-ready.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Jost:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF5F2}
*{box-sizing:border-box}
a{color:#2B1D21;text-decoration:none}a:hover{color:#9A5845}
button{font-family:inherit;cursor:pointer}
@keyframes sabiFadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes sabiFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes sabiPulse{0%{box-shadow:0 0 0 0 rgba(37,211,102,.55)}100%{box-shadow:0 0 0 20px rgba(37,211,102,0)}}
@keyframes sabiPop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes sabiDot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.s-fade{animation:sabiFadeUp 1s cubic-bezier(.2,.7,.2,1) both}.s-d1{animation-delay:.12s}.s-d2{animation-delay:.26s}
.s-float{animation:sabiFloat 6s ease-in-out infinite}
.s-pulse{animation:sabiPulse 2s ease-out infinite}
.s-pop{animation:sabiPop .5s cubic-bezier(.2,.7,.2,1) both}
.s-dot{animation:sabiDot 1.2s ease-in-out infinite}
.s-lift{transition:transform .5s cubic-bezier(.2,.7,.2,1),box-shadow .5s}.s-lift:hover{transform:translateY(-4px);box-shadow:0 24px 48px -26px rgba(43,29,33,.45)}
.s-btn{transition:transform .3s,background-color .3s,box-shadow .3s}.s-btn:hover{transform:translateY(-2px);box-shadow:0 14px 28px -14px rgba(43,29,33,.6);background-color:#5A3A44 !important}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
input{font-family:inherit}
</style>
<script src="assets/js/sabi-runtime.js"></script>
<script src="assets/js/components.js"></script>
</head>
<body>
<div id="app"></div>

<!-- Page template (rendered by assets/js/sabi-runtime.js) -->
<template id="sabi-page">
<div style="width: 100%; min-height: 100vh; background: #FBF5F2; color: #2B1D21; font-family: Jost, system-ui, sans-serif">

<div style="background: #2B1D21; color: #F7EDE8; text-align: center; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; padding: 11px 16px">Complimentary discovery vial with every order</div>
<header style="border-bottom: 1px solid #EADDD7">
<div style="max-width: 1320px; margin: 0 auto; padding: 18px 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<nav aria-label="Primary" style="display: flex; flex-wrap: wrap; gap: 26px; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; flex: 1 1 360px">
<a href="index.html">Home</a>
<a href="product.html">Shop</a>
<a href="about.html">About Us</a>
<a href="history.html">Our History</a>
<a href="faq.html">FAQs</a>
</nav>
<a href="index.html" style="font-family: 'Cormorant Garamond', serif; font-size: 44px; font-weight: 500; letter-spacing: 0.32em; line-height: 1; padding-left: 0.32em">SABI</a>
<div style="display: flex; justify-content: flex-end; flex: 1 1 360px">
<a href="cart.html" style="min-height: 44px; display: flex; align-items: center; gap: 8px; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; border-bottom: 1px solid #2B1D21">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 8h14l-1 13H6L5 8z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>Bag ({{count}})</a>
</div>
</div>
</header>

<section style="max-width: 1320px; margin: 0 auto; padding: 72px 32px 112px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 40px">
<h1 class="s-fade" style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: clamp(48px, 5vw, 72px); line-height: 1">Your <em>Bag</em></h1>
<span style="font-size: 15px; color: #5E4A4F">{{count}} items</span>
</div>

<sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
<div style="background: #FFFFFF; border: 1px solid #EADDD7; border-radius: 28px; padding: 88px 32px; display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center">
<span style="font-family: 'Cormorant Garamond', serif; font-size: 40px">Your bag is empty</span>
<span style="font-size: 16px; color: #5E4A4F">Your signature scent is waiting.</span>
<a href="product.html" style="background: #2B1D21; color: #FBF5F2; padding: 18px 34px; font-size: 14px; letter-spacing: 0.16em; text-transform: uppercase; border-radius: 999px">Continue shopping</a>
</div>
</sc-if>

<sc-if value="{{hasItems}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start">
<!-- Items -->
<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="3">
<article class="s-pop s-lift" style="background: #FFFFFF; border: 1px solid #EADDD7; border-radius: 24px; padding: 20px; display: flex; flex-wrap: wrap; gap: 24px; align-items: center">
<div style="width: 132px; height: 152px; border-radius: 18px; background: {{it.bg}}; display: flex; align-items: center; justify-content: center; flex: 0 0 132px">
<div class="s-float" style="width: 82px; height: 131px"><dc-import name="Bottle" shape="{{it.shape}}" liquid="{{it.color}}" cap="{{it.cap}}" label="" hint-size="100%,100%"></dc-import></div>
</div>
<div style="flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: {{accent}}; font-weight: 500">{{it.brand}} · {{it.family}}</span>
<a href="product.html" style="font-family: 'Cormorant Garamond', serif; font-size: 30px; line-height: 1.05">{{it.name}}</a>
<span style="font-size: 14px; color: #5E4A4F">Size: {{it.size}}</span>
<button onClick="{{it.remove}}" style="align-self: flex-start; min-height: 44px; padding: 0; border: 0; background: transparent; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #5E4A4F; text-decoration: underline">Remove</button>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 14px">
<span style="font-size: 17px; font-weight: 500">Rs. [PRICE]</span>
<div style="display: flex; align-items: center; border: 1px solid #C9B2AA; border-radius: 999px">
<button onClick="{{it.dec}}" aria-label="Decrease {{it.name}} quantity" style="width: 44px; height: 44px; border: 0; background: transparent; font-size: 20px; color: #2B1D21">−</button>
<span style="min-width: 28px; text-align: center; font-size: 16px">{{it.qty}}</span>
<button onClick="{{it.inc}}" aria-label="Increase {{it.name}} quantity" style="width: 44px; height: 44px; border: 0; background: transparent; font-size: 20px; color: #2B1D21">+</button>
</div>
</div>
</article>
</sc-for>
<div style="display: flex; align-items: center; gap: 14px; background: #F2DCD6; border-radius: 20px; padding: 18px 22px; font-size: 15px">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B1D21" stroke-width="1.5"><rect x="3" y="9" width="18" height="12" rx="1"></rect><path d="M3 9h18M12 9v12M12 9c-2-4-6-4-6-1s6 1 6 1zM12 9c2-4 6-4 6-1s-6 1-6 1z"></path></svg>
<span>A complimentary discovery vial will be added to your order.</span>
</div>
<a href="product.html" style="align-self: flex-start; font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; border-bottom: 1px solid #2B1D21; padding-bottom: 4px; margin-top: 8px">Continue shopping</a>
</div>

<!-- Summary -->
<aside aria-label="Order summary" style="flex: 1 1 360px; background: #FFFFFF; border: 1px solid #EADDD7; border-radius: 28px; padding: 32px; display: flex; flex-direction: column; gap: 22px">
<h2 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 32px">Order summary</h2>

<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 500; padding: 0 0 10px">Delivery</legend>
<label style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border: 1px solid #D9C4BC; border-radius: 14px; cursor: pointer">
<input type="radio" name="delivery" checked="{{standard}}" onChange="{{pickStandard}}" style="width: 18px; height: 18px; accent-color: #2B1D21">
<span style="flex: 1; font-size: 15px">Standard · [X–Y] working days</span>
<span style="font-size: 15px">Rs. [FEE]</span>
</label>
<label style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border: 1px solid #D9C4BC; border-radius: 14px; cursor: pointer">
<input type="radio" name="delivery" checked="{{express}}" onChange="{{pickExpress}}" style="width: 18px; height: 18px; accent-color: #2B1D21">
<span style="flex: 1; font-size: 15px">Express · [X] working days</span>
<span style="font-size: 15px">Rs. [FEE]</span>
</label>
</fieldset>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="promo" style="font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 500">Promo code</label>
<div style="display: flex; gap: 8px">
<input id="promo" type="text" placeholder="Enter code" style="flex: 1; min-width: 0; min-height: 50px; padding: 0 16px; border: 1px solid #C9B2AA; border-radius: 12px; background: #FBF5F2; font-size: 15px; color: #2B1D21">
<button style="min-height: 50px; padding: 0 20px; border: 1px solid #2B1D21; border-radius: 12px; background: transparent; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #2B1D21">Apply</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 12px; border-top: 1px solid #EADDD7; padding-top: 20px; font-size: 15px">
<div style="display: flex; justify-content: space-between"><span style="color: #5E4A4F">Subtotal ({{count}} items)</span><span>Rs. [SUBTOTAL]</span></div>
<div style="display: flex; justify-content: space-between"><span style="color: #5E4A4F">Delivery ({{deliveryName}})</span><span>Rs. [FEE]</span></div>
<div style="display: flex; justify-content: space-between"><span style="color: #5E4A4F">Discovery vial</span><span>Free</span></div>
<div style="display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid #EADDD7; padding-top: 16px">
<span style="font-family: 'Cormorant Garamond', serif; font-size: 28px">Total</span><span style="font-size: 20px; font-weight: 500">Rs. [TOTAL]</span>
</div>
</div>

<a class="s-btn" href="cart.html" style="display: flex; align-items: center; justify-content: center; min-height: 58px; background: #2B1D21; color: #FBF5F2; border-radius: 999px; font-size: 14px; letter-spacing: 0.16em; text-transform: uppercase">Proceed to checkout</a>
<div style="display: flex; flex-direction: column; gap: 8px; align-items: center; text-align: center">
<span style="font-size: 13px; color: #5E4A4F; display: flex; align-items: center; gap: 8px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5E4A4F" stroke-width="1.5"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Secure checkout</span>
<span style="font-size: 13px; color: #5E4A4F">Cash on delivery · Debit / credit card · Bank transfer</span>
</div>
</aside>
</div>
</sc-if>
</section>

<footer style="background: #2B1D21; color: #E5D6D1; padding: 56px 32px 36px">
<div style="max-width: 1320px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'Cormorant Garamond', serif; font-size: 34px; letter-spacing: 0.3em; color: #F7EDE8; line-height: 1">SABI</span>
<span style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 19px; color: #E7BFB3">Every Scent. Your Signature.</span>
</div>
<nav aria-label="Footer" style="display: flex; flex-wrap: wrap; gap: 24px; font-size: 14px">
<a href="index.html" style="color: #E5D6D1">Home</a>
<a href="product.html" style="color: #E5D6D1">Shop</a>
<a href="about.html" style="color: #E5D6D1">About Us</a>
<a href="history.html" style="color: #E5D6D1">Our History</a>
<a href="faq.html" style="color: #E5D6D1">FAQs</a>
<a href="cart.html" style="color: #E5D6D1">Bag</a>
</nav>
<span style="font-size: 13px; color: #BFA9A3">© Sabi Fragrances. All rights reserved.</span>
</div>
</footer>

<dc-import name="Chat" hint-size="1px,1px"></dc-import>
</div>
</template>

<script src="assets/js/cart.js"></script>
</body>
</html>
